services:
  - type: pserv
    name: bs-pserv
    plan: starter
    region: oregon
    buildSource: django-mm2ewb9s
    startCommand: >-
      echo "svc=$RENDER_SERVICE_NAME stamp=$(cat build-stamp.txt)";
      python -m gunicorn mysite.asgi:application -k uvicorn.workers.UvicornWorker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: ALLOWED_HOSTS
        value: "*"
